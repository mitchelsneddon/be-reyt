name: BeReyt
options:
  bundleIdPrefix: local.mitchel
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: C76RQ9NG73
    CODE_SIGN_STYLE: Automatic
packages:
  ReytKit:
    path: Packages/ReytKit
targets:
  BeReyt:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: ReytKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: be reyt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: be reyt uses face id to keep your journal private. nothing leaves your phone.
        NSHealthShareUsageDescription: be reyt reads your workouts from apple health so they can sit quietly beside your day. nothing leaves your phone.
        UIAppFonts:
          - PlayfairDisplay-Medium.ttf
          - PlayfairDisplay-Italic.ttf
          - PlayfairDisplay-MediumItalic.ttf
          - Lora-Regular.ttf
          - Lora-Medium.ttf
          - Lora-Italic.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: local.mitchel.bereyt.archive
            UTTypeDescription: be reyt backup
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - aea
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: App/BeReyt.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.mitchel.bereyt
        PRODUCT_NAME: BeReyt
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  BeReyt:
    build:
      targets:
        BeReyt: all
    run:
      config: Debug
